{% extends 'core/base.html' %}
{% block title %}Forgot Password — ClockTower Admin{% endblock %}

{% block body %}
<style>
  .forgot-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    background:
      radial-gradient(circle at 80% 10%, rgba(255,184,77,0.07) 0%, transparent 50%),
      radial-gradient(circle at 20% 90%, rgba(255,122,69,0.05) 0%, transparent 50%),
      var(--bg);
  }

  .forgot-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .forgot-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 20px 20px 0 0;
  }

  .forgot-card .logo {
    font-size: 48px;
    margin-bottom: 6px;
    display: block;
  }

  .forgot-card .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--text);
  }

  .forgot-card .brand span {
    color: var(--accent);
  }

  .forgot-card .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 28px;
  }

  .forgot-card .field {
    margin-bottom: 16px;
    text-align: left;
  }

  .forgot-card .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .forgot-card .field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s;
  }

  .forgot-card .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,184,77,0.1);
  }

  .forgot-card .field .hint {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    font-style: italic;
    opacity: 0.8;
  }

  .forgot-card .field .hint em {
    color: var(--accent);
    font-style: normal;
    font-weight: 500;
  }

  .submit-btn {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    margin-top: 4px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }

  .submit-btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }

  .submit-btn:active {
    transform: translateY(0);
  }

  .error-msg {
    color: var(--danger);
    font-size: 12px;
    margin-top: 12px;
    padding: 10px 14px;
    background: rgba(255,107,107,0.1);
    border: 1px solid rgba(255,107,107,0.15);
    border-radius: 10px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .error-msg i {
    font-size: 14px;
    flex-shrink: 0;
  }

  .success-msg {
    color: var(--green);
    font-size: 12px;
    margin-top: 12px;
    padding: 10px 14px;
    background: rgba(52,211,153,0.1);
    border: 1px solid rgba(52,211,153,0.15);
    border-radius: 10px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .success-msg i {
    font-size: 14px;
    flex-shrink: 0;
  }

  .back-link {
    margin-top: 20px;
    font-size: 12px;
    color: var(--muted);
  }

  .back-link a {
    color: var(--accent);
    font-weight: 500;
    transition: opacity 0.2s;
  }

  .back-link a:hover {
    text-decoration: underline;
    opacity: 0.85;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  @media (max-width: 480px) {
    .forgot-card { padding: 30px 22px; }
    .forgot-card .brand { font-size: 19px; }
    .forgot-card .logo { font-size: 40px; }
  }
</style>

<div class="forgot-wrap">
  <div class="forgot-card">
    <span class="logo">🔑</span>
    <h1 class="brand">Clock<span>Tower</span></h1>
    <p class="subtitle">Reset your password</p>

    {% if error %}
    <div class="error-msg">
      <i class="li-n-alertcircle"></i>
      {{ error }}
    </div>
    {% elif success %}
    <div class="success-msg">
      <i class="li-n-checkcircle"></i>
      {{ success }}
    </div>
    {% endif %}

    <form method="POST" action="">
      {% csrf_token %}

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
      </div>

      <button type="submit" class="submit-btn">
        <i class="li-n-key"></i>&nbsp; Reset Password
      </button>
    </form>

    <div class="back-link">
      <a href="{% url 'login' %}"><i class="li-n-arrowleft"></i> Rudi kwenye Login</a>
    </div>
  </div>
</div>
{% endblock %}

{% extends 'core/base.html' %}
{% block title %}Login — ClockTower Admin{% endblock %}

{% block body %}
<style>
  .login-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,184,77,0.07) 0%, transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(255,122,69,0.05) 0%, transparent 50%),
      var(--bg);
  }

  .login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .login-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 20px 20px 0 0;
  }

  .login-card .logo {
    font-size: 48px;
    margin-bottom: 6px;
    display: block;
  }

  .login-card .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--text);
  }

  .login-card .brand span {
    color: var(--accent);
  }

  .login-card .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 28px;
  }

  .login-card .field {
    position: relative;
    margin-bottom: 16px;
    text-align: left;
  }

  .login-card .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .login-card .field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s;
  }

  .login-card .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,184,77,0.1);
  }

  .toggle-pw {
    position: absolute;
    right: 12px;
    top: 35px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    padding: 4px;
    transition: color 0.2s;
  }

  .toggle-pw:hover {
    color: var(--accent);
  }

  .login-btn {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    margin-top: 4px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }

  .login-btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }

  .login-btn:active {
    transform: translateY(0);
  }

  .login-links {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    font-size: 12px;
  }

  .login-links a {
    color: var(--accent);
    font-weight: 500;
    transition: opacity 0.2s;
  }

  .login-links a:hover {
    text-decoration: underline;
    opacity: 0.85;
  }

  .error-msg {
    color: var(--danger);
    font-size: 12px;
    margin-top: 12px;
    padding: 10px 14px;
    background: rgba(255,107,107,0.1);
    border: 1px solid rgba(255,107,107,0.15);
    border-radius: 10px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .error-msg i {
    font-size: 14px;
    flex-shrink: 0;
  }

  .login-footer {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
  }

  .login-footer strong {
    color: var(--text);
    font-weight: 600;
  }

  @media (max-width: 480px) {
    .login-card { padding: 30px 22px; }
    .login-card .brand { font-size: 19px; }
    .login-card .logo { font-size: 40px; }
  }
</style>

<div class="login-wrap">
  <div class="login-card">
    <span class="logo">🔒</span>
    <h1 class="brand">Clock<span>Tower</span></h1>
    <p class="subtitle">Food Service Admin Panel</p>

    {% if error %}
    <div class="error-msg">
      <i class="fas fa-exclamation-circle"></i>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <button type="button" class="toggle-pw" onclick="togglePassword()" aria-label="Toggle password visibility">
          <i class="fas fa-eye" id="pwIcon"></i>
        </button>
      </div>

      <button type="submit" class="login-btn">
        <i class="fas fa-arrow-right-to-bracket"></i>&nbsp; Sign In
      </button>
    </form>

    <div class="login-links">
      <a href="{% url 'forgot' %}">Umesahau password?</a>
    </div>

    <div class="login-footer">
      <strong>Default Credentials:</strong><br>
      Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>admin123</strong>
    </div>
  </div>
</div>

<script>
function togglePassword() {
  const pw = document.getElementById('password');
  const icon = document.getElementById('pwIcon');
  if (pw.type === 'password') {
    pw.type = 'text';
    icon.classList.replace('fa-eye', 'fa-eye-slash');
  } else {
    pw.type = 'password';
    icon.classList.replace('fa-eye-slash', 'fa-eye');
  }
}
</script>
{% endblock %}
